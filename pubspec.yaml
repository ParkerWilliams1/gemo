name: gemo
description: A college-exclusive video chat app for students to connect, study, and socialize securely.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.0
  firebase_core: ^3.11.0
  firebase_auth: ^5.4.2
  cloud_firestore: ^5.6.4
  fluttertoast: ^8.2.12
  videosdk: ^1.3.1
  logging: ^1.3.0
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.0.0

flutter_native_splash:
  color: "#ffffff"
  image: assets/gemo.png
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
   - assets/background.png
   - assets/gemo.png
   - assets/HomeScreen.png