name: gemo
description: A college-exclusive video chat app for students to connect, study, and socialize securely.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloud_functions: ^5.4.0
  google_fonts: ^6.2.0
  firebase_core: ^3.11.0
  firebase_auth: ^5.4.2
  cloud_firestore: ^5.6.4
  fluttertoast: ^8.2.12
  videosdk: ^1.3.1
  flutter_riverpod: ^2.0.1
  uuid: ^4.5.1
  logging: ^1.3.0
  http: ^1.3.0
  firebase_storage: ^12.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
   - lib/images/background.png
   - lib/images/gemo.png
   - lib/images/HomeScreen.png